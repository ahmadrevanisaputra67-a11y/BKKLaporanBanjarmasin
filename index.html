<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login | BKK Banjarmasin</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0d47a1;--teal:#5f9f9f;--field:#1e332a;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html{font-size:clamp(8px,min(.82vw,1.35vh),17px)}
html,body{height:100%}
body{font-family:Alegreya,Georgia,serif;font-weight:700;background:#fff;color:#fff}
.page{position:relative;width:100%;height:100%;min-height:34rem;overflow:hidden;background:#fff}
.art{position:absolute;left:0;top:0;width:60%;height:100%;display:flex;align-items:center;justify-content:center;padding:2% 1%}
.art img{width:100%;height:100%;object-fit:contain}
.wave{position:absolute;left:38.5%;top:0;width:61.5%;height:100%;display:block}
.brand{position:absolute;left:2.6%;top:3%}
.brand img{height:10rem;width:auto;display:block;mix-blend-mode:multiply}
.formside{position:absolute;left:62%;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
form{width:42rem}
h1{font-size:4.6rem;font-weight:700;line-height:1;margin-bottom:2.4rem}
label{display:block;font-size:1.8rem;margin:1.4rem 0 .7rem}
input{width:100%;height:4.4rem;padding:0 2.6rem;border-radius:999px;border:0;background:var(--field);color:#fff;font:inherit;font-weight:500;font-size:1.8rem;text-align:center}
input::placeholder{color:#8f9f97}
input:focus-visible,button:focus-visible,a:focus-visible{outline:.3rem solid #fff;outline-offset:.3rem}
.forgot{display:block;text-align:right;font-size:1.2rem;margin-top:1.4rem;color:#fff;text-decoration:underline}
button{width:100%;height:4.4rem;margin-top:2.4rem;border:0;border-radius:999px;background:var(--teal);color:#fff;font:inherit;font-weight:700;font-size:1.9rem;cursor:pointer}
button:hover{filter:brightness(1.08)}
.reg{text-align:center;font-size:1.6rem;margin-top:2.2rem;line-height:1.5}
.reg a{display:block;color:#fff;font-size:1.5rem;text-decoration:underline}
#msg{min-height:1.4em;font-size:1.4rem;margin-top:1rem;text-align:center;color:#ffd0d0}
.mob{display:none}
@media (max-width:820px){
 html{font-size:16px}
 .page{height:auto;min-height:100%;display:flex;flex-direction:column;overflow:visible}
 .art,.wave,.brand{display:none}
 .mob{display:block;position:relative;height:44vh;min-height:270px;background:var(--blue);overflow:hidden}
 .mobart{position:absolute;left:4%;top:4%;width:92%;height:92%;object-fit:contain}
 .moblogo{position:absolute;left:14px;top:14px;height:40px;width:auto;background:#fff;padding:6px 12px;border-radius:999px}
 .formside{position:static;flex:1;color:#14305c;padding:26px 0 40px;align-items:flex-start}
 form{width:min(330px,84%)}
 h1{color:#0f5d57;font-size:2.2rem;margin-bottom:18px}
 label{display:none}
 input{height:48px;font-size:1rem;padding:0 22px}
 input::placeholder{color:#9db3aa}
 #p{margin-top:14px}
 .forgot{font-size:.8rem;margin-top:10px;color:#456}
 button{height:48px;font-size:1.05rem;margin-top:20px}
 .reg{font-size:.9rem;margin-top:16px;color:#456}.reg a{color:#0f5d57;font-size:.9rem}
 #msg{font-size:.85rem;color:#b00020}
}
</style>
</head>
<body>
<div class="page">
 <div class="art"><img src="Icon%20tengah%20kiri%20login.png" alt="Ilustrasi"></div>
 <svg class="wave" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0.0 0.0 C0.1 0.5 0.1 1.4 0.4 2.7 C0.8 4.1 1.3 6.3 2.0 8.1 C2.7 9.9 3.7 11.7 4.9 13.5 C6.0 15.3 7.4 17.1 8.8 18.9 C10.3 20.7 12.0 22.5 13.7 24.3 C15.4 26.1 17.2 27.9 19.0 29.7 C20.8 31.5 22.8 33.3 24.6 35.1 C26.3 36.9 27.9 38.7 29.4 40.5 C30.9 42.3 32.4 44.1 33.6 45.9 C34.8 47.7 35.7 49.5 36.5 51.4 C37.3 53.2 38.0 55.0 38.5 56.8 C39.0 58.6 39.4 60.4 39.6 62.2 C39.8 64.0 39.9 65.8 39.8 67.6 C39.8 69.4 39.7 71.2 39.4 73.0 C39.0 74.8 38.4 76.6 37.8 78.4 C37.2 80.2 36.6 82.0 35.8 83.8 C35.1 85.6 34.3 87.4 33.4 89.2 C32.5 91.0 31.3 92.8 30.5 94.6 C29.7 96.4 28.9 99.1 28.5 100.0 L100 100 L100 0 Z" fill="#0d47a1"/></svg>
 <div class="mob" aria-hidden="true">
  <img class="mobart" src="Icon%20tengah%20kiri%20login.png" alt="">
  <img class="moblogo" src="Logo%20BKK%20Banjarmasin.png" alt="">
 </div>
 <div class="brand"><img src="Logo%20BKK%20Banjarmasin.png" alt="Logo Kemenkes BKK Banjarmasin"></div>
 <main class="formside">
  <form id="f" novalidate>
   <h1>Login</h1>
   <label for="u">Username</label>
   <input id="u" name="username" autocomplete="username" placeholder="Enter your username">
   <label for="p">Password</label>
   <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Enter your password">
   <a class="forgot" href="#">Forgot Password?</a>
   <button type="submit">Login to Akun</button>
   <p id="msg" role="alert"></p>
  </form>
 </main>
</div>
<script>
document.getElementById('f').addEventListener('submit',function(e){
 e.preventDefault();
 var u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,m=document.getElementById('msg');
 m.textContent=(!u||!p)?'Username dan password wajib diisi.':'Tampilan saja. Hubungkan ke backend untuk proses login.';
});
</script>
</body>
</html>
